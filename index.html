<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102b2c" />
    <meta name="description" content="Fake Bomb It 固定地图触屏与键盘训练场，展示独立游戏规则的实体视图。" />
    <title>Fake Bomb It · 实体训练场</title>
  </head>
  <body>
    <main id="game" aria-label="Fake Bomb It 实体训练场"></main>
    <p id="instructions" class="sr-only">横屏使用左侧四向摇杆移动，右侧按钮放弹，也可使用 WASD 或方向键及空格。点击暂停或按 P、Escape 暂停，点击继续游戏或按 Enter 手动继续。R 或重试按钮重试。离开页面会自动暂停；炸弹三秒后爆炸。</p>
    <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript>请启用 JavaScript 运行键盘训练场。</noscript>
    <script type="module" src="/src/browser/main.ts"></script>
